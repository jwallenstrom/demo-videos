name: Build Full Video

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Create output folder
        run: mkdir -p out

      - name: Check secrets are set
        run: |
          if [ -z "$HEYGEN_API_KEY" ]; then
            echo "❌ HEYGEN_API_KEY is empty — secret not found in GitHub"
            echo "Go to: github.com/jwallenstrom/demo-videos → Settings → Secrets and variables → Actions"
            exit 1
          else
            echo "✅ HEYGEN_API_KEY is set (${#HEYGEN_API_KEY} characters)"
          fi
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}

      # ── Step 1: Generate presenter via HeyGen ──────────────────────────────
      - name: Generate presenter video (HeyGen)
        run: node scripts/generate-presenter.mjs
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}

      # ── Step 2: Render product demo (Remotion) ─────────────────────────────
      - name: Install Remotion's bundled Chromium
        run: npx remotion browser ensure

      - name: Render product demo
        run: |
          npx remotion render TheShift-16x9 \
            --output out/product-demo.mp4 \
            --gl=angle

      # ── Step 3: Combine side by side ───────────────────────────────────────
      - name: Combine into split screen
        run: |
          # Check both files exist and have video streams
          echo "=== Presenter info ==="
          ffprobe -v error -show_streams -select_streams v out/presenter.mp4 | grep codec_name || true
          ffprobe -v error -show_streams -select_streams a out/presenter.mp4 | grep codec_name && HAS_AUDIO=1 || HAS_AUDIO=0
          echo "Presenter has audio: $HAS_AUDIO"

          echo "=== Product demo info ==="
          ffprobe -v error -show_streams -select_streams v out/product-demo.mp4 | grep codec_name || true

          # Combine — use presenter audio if it exists, otherwise silence
          ffmpeg -y -i out/presenter.mp4 -i out/product-demo.mp4 \
            -filter_complex \
            "[0:v]scale=640:1080:force_original_aspect_ratio=increase,crop=640:1080,setsar=1[left]; \
             [1:v]scale=1280:1080:force_original_aspect_ratio=increase,crop=1280:1080,setsar=1[right]; \
             [left][right]hstack=inputs=2[vout]" \
            -map "[vout]" \
            -map "0:a?" \
            -c:v libx264 -crf 18 -preset fast \
            -c:a aac -b:a 192k \
            -shortest \
            out/corridor-demo.mp4

          echo "=== Output ==="
          du -sh out/corridor-demo.mp4

      # ── Upload final video ─────────────────────────────────────────────────
      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: corridor-demo
          path: out/corridor-demo.mp4
          retention-days: 14
