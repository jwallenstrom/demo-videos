name: Render Video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Which video to render'
        required: false
        default: 'TheShift-16x9'
        type: choice
        options:
          - TheShift-16x9
          - TheShift

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Remotion's bundled Chromium
        run: npx remotion browser ensure

      - name: Render video
        run: |
          mkdir -p out
          npx remotion render ${{ github.event.inputs.composition }} \
            --output out/${{ github.event.inputs.composition }}.mp4 \
            --gl=angle \
            --log=verbose

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.composition }}
          path: out/${{ github.event.inputs.composition }}.mp4
          retention-days: 7
