name: Render Video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Which video to render'
        required: false
        default: 'TheShift_16x9'
        type: choice
        options:
          - TheShift_16x9
          - TheShift

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Render video
        run: |
          mkdir -p out
          npx remotion render ${{ github.event.inputs.composition }} \
            --output out/${{ github.event.inputs.composition }}.mp4 \
            --log=verbose
        env:
          DISPLAY: ':99'

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.composition }}
          path: out/${{ github.event.inputs.composition }}.mp4
          retention-days: 7
