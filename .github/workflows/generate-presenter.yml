name: Generate Presenter Video

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create output folder
        run: mkdir -p out

      - name: Generate presenter video via HeyGen
        run: node scripts/generate-presenter.mjs
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}

      - name: Upload presenter video
        uses: actions/upload-artifact@v4
        with:
          name: presenter
          path: out/presenter.mp4
          retention-days: 7
